#:schema https://raw.githubusercontent.com/openai/codex/refs/heads/main/codex-rs/core/config.schema.json
model = "gpt-5.4"
model_reasoning_effort = "medium"
personality = "pragmatic"

[notice.model_migrations]
"gpt-5.2-codex" = "gpt-5.3-codex"
"gpt-5.1-codex-mini" = "gpt-5.4"
"gpt-5.3-codex" = "gpt-5.4"

[tui]
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "five-hour-limit"]
theme = "zenburn"
notification_condition = "unfocused"

[tui.model_availability_nux]
"gpt-5.3-codex-spark" = 4
"gpt-5.5" = 4

[plugins."github@openai-curated"]
enabled = true

[projects."/home/chrono/Dev/Homelab/docker-compose-nas"]
trust_level = "trusted"

[projects."/home/chrono/.dotfiles"]
trust_level = "trusted"

[projects."/home/chrono/Dev/personal-site-alyx"]
trust_level = "trusted"

[projects."/home/chrono"]
trust_level = "trusted"
