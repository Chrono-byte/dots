#:schema https://forgejo.disilla.org/chrono/flux/raw/branch/main/schemas/config.schema.json

[general]
repo_path = "~/.dotfiles"
current_profile = "default"
symlink_resolution = "auto"

[tools.fonts]
files = [
  { repo = "fonts/SF-Mono-Regular.otf", dest = ".local/share/fonts/SF-Mono-Regular.otf", conditions = { os = [
    "linux",
  ] } },
  { repo = "fonts/SFHello-Regular.otf", dest = ".local/share/fonts/SFHello-Regular.otf", conditions = { os = [
    "linux",
  ] } },
  { repo = "fonts/SFMonoNerdFont-Regular.otf", dest = ".local/share/fonts/SFMonoNerdFont-Regular.otf", conditions = { os = [
    "linux",
  ] } },
  { repo = "fonts/JetBrainsMonoNerdFont-Regular.ttf", dest = ".local/share/fonts/JetBrainsMonoNerdFont-Regular.ttf", conditions = { os = [
    "linux",
  ] } },
  { repo = "fonts/IBMPlexSans.ttf", dest = ".local/share/fonts/IBMPlexSans.ttf", conditions = { os = [
    "linux",
  ] } },
  { repo = "fonts/SF-Mono-Regular.otf", dest = "Library/Fonts/SF-Mono-Regular.otf", conditions = { os = [
    "darwin",
  ] } },
  { repo = "fonts/SFHello-Regular.otf", dest = "Library/Fonts/SFHello-Regular.otf", conditions = { os = [
    "darwin",
  ] } },
  { repo = "fonts/SFMonoNerdFont-Regular.otf", dest = "Library/Fonts/SFMonoNerdFont-Regular.otf", conditions = { os = [
    "darwin",
  ] } },
  { repo = "fonts/JetBrainsMonoNerdFont-Regular.ttf", dest = "Library/Fonts/JetBrainsMonoNerdFont-Regular.ttf", conditions = { os = [
    "darwin",
  ] } },
  { repo = "fonts/IBMPlexSans.ttf", dest = "Library/Fonts/IBMPlexSans.ttf", conditions = { os = [
    "darwin",
  ] } },
]

[tools.waybar]
files = [
  { repo = "waybar/config", dest = ".config/waybar/config" },
  { repo = "waybar/style.css", dest = ".config/waybar/style.css" },
]

[tools.zsh]
files = [
  { repo = "zsh/.zshrc", dest = ".zshrc", conditions = { os = [
    "linux",
  ] } },
  { repo = "zsh/.zshrc.macos", dest = ".zshrc", conditions = { os = [
    "darwin",
  ] } },
  { repo = "zsh/.zshrc.common", dest = ".zshrc.common" },
  { repo = "zsh/.zshrc.lazy", dest = ".zshrc.lazy" },
]

[tools.sway]
files = [
  { repo = "sway/config", dest = ".config/sway/config" },
  { repo = "sway/config.d/60-bindings-screenshot.conf", dest = ".config/sway/config.d/60-bindings-screenshot.conf" },
  { repo = "sway/config.d/90-bar.conf", dest = ".config/sway/config.d/90-bar.conf" },
]

[tools.starship]
files = [{ repo = "starship/starship.toml", dest = ".config/starship.toml" }]

[tools.alacritty]
files = [{ repo = "alacritty/alacritty.toml", dest = ".config/alacritty/alacritty.toml" }]

[tools.zed]
files = [{ repo = "zed/settings.json", dest = ".config/zed/settings.json" }]

[tools.ghostty]
folders = [{ repo = "ghostty", dest = ".config/ghostty" }]

[tools.nvim]
folders = [{ repo = "nvim", dest = ".config/nvim" }]

[tools.codex]
files = [
  { repo = "codex/config.toml", dest = ".codex/config.toml", conditions = { os = ["linux"] } },
  { repo = "codex/config.macos.toml", dest = ".codex/config.toml", conditions = { os = ["darwin"] } },
  { repo = "codex/AGENTS.md", dest = ".codex/AGENTS.md" },
]
folders = [{ repo = "codex/skills", dest = ".codex/skills" }]

[tools."pi/agent"]
folders = [{ repo = "pi/agent", dest = ".pi/agent" }]

[tools.niri]
folders = [{ repo = "niri", dest = ".config/niri" }]

[tools.noctalia]
folders = [{ repo = "noctalia", dest = ".config/noctalia" }]

[tools.mako]
folders = [{ repo = "mako", dest = ".config/mako" }]

[tools.fuzzel]
files = [{ repo = "fuzzel/fuzzel.ini", dest = ".config/fuzzel/fuzzel.ini" }]

[tools.scripts]
files = [
  { repo = "scripts/aiusage-account-backfill", dest = ".local/bin/aiusage-account-backfill", conditions = { os = ["linux"] } },
  { repo = "scripts/codex-cloud-usage", dest = ".local/bin/codex-cloud-usage", conditions = { os = ["linux"] } },
  { repo = "scripts/window-title-waybar", dest = ".local/bin/window-title-waybar" },
  { repo = "scripts/niri-dynamic-float", dest = ".local/bin/niri-dynamic-float" },
]

[tools.systemd]
files = [
  { repo = "systemd/user/codex-cloud-usage.service", dest = ".config/systemd/user/codex-cloud-usage.service", conditions = { os = ["linux"] } },
  { repo = "systemd/user/niri-dynamic-float.service", dest = ".config/systemd/user/niri-dynamic-float.service" },
]

[tools.fastfetch]
files = [{ repo = "fastfetch/config.jsonc", dest = ".config/fastfetch/config.jsonc" }]
