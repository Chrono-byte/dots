#:schema https://forgejo.disilla.org/chrono/flux/raw/branch/main/schemas/config.schema.json

[general]
repo_path = "~/.dotfiles"
current_profile = "default"
symlink_resolution = "auto"

[tools.fonts]
files = [
  { repo = "fonts/SF-Mono-Regular.otf", dest = ".local/share/fonts/SF-Mono-Regular.otf" },
  { repo = "fonts/SFHello-Regular.otf", dest = ".local/share/fonts/SFHello-Regular.otf" },
  { repo = "fonts/SFMonoNerdFont-Regular.otf", dest = ".local/share/fonts/SFMonoNerdFont-Regular.otf" },
  { repo = "fonts/JetBrainsMonoNerdFont-Regular.ttf", dest = ".local/share/fonts/JetBrainsMonoNerdFont-Regular.ttf" },
]

[tools.waybar]
files = [
  { repo = "waybar/config", dest = ".config/waybar/config" },
  { repo = "waybar/style.css", dest = ".config/waybar/style.css" },
]

[tools.zsh]
files = [
  { repo = "zsh/.zshrc", dest = ".zshrc" },
  { repo = "zsh/.zshrc.lazy", dest = ".zshrc.lazy" },
]

[tools.sway]
files = [
  { repo = "sway/config", dest = ".config/sway/config" },
  { repo = "sway/config.d/60-bindings-screenshot.conf", dest = ".config/sway/config.d/60-bindings-screenshot.conf" },
  { repo = "sway/config.d/90-bar.conf", dest = ".config/sway/config.d/90-bar.conf" },
]

[tools.starship]
files = [{ repo = "starship/starship.toml", dest = ".config/starship.toml" }]

[tools.alacritty]
files = [{ repo = "alacritty/alacritty.toml", dest = ".config/alacritty/alacritty.toml" }]

[tools.zed]
files = [{ repo = "zed/settings.json", dest = ".config/zed/settings.json" }]

[tools.ghostty]
files = [{ repo = "ghostty/config", dest = ".config/ghostty/config" }]

[tools.nvim]
folders = [{ repo = "nvim", dest = ".config/nvim" }]

[tools.codex]
files = [{ repo = "codex/config.toml", dest = ".codex/config.toml" }]

[tools.niri]
folders = [{ repo = "niri", dest = ".config/niri" }]

[tools.mako]
folders = [{ repo = "mako", dest = ".config/mako" }]

[tools.fuzzel]
files = [{ repo = "fuzzel/fuzzel.ini", dest = ".config/fuzzel/fuzzel.ini" }]

[tools.applications]
files = [
  { repo = "applications/com.discordapp.Discord.desktop", dest = ".local/share/applications/com.discordapp.Discord.desktop" },
]

[tools.icons]
folders = [{ repo = "icons", dest = ".icons" }]

[tools.scripts]
files = [
  { repo = "scripts/notifications-menu", dest = ".local/bin/notifications-menu" },
  { repo = "scripts/notifications-waybar", dest = ".local/bin/notifications-waybar" },
  { repo = "scripts/tailscale-menu", dest = ".local/bin/tailscale-menu" },
  { repo = "scripts/tailscale-waybar", dest = ".local/bin/tailscale-waybar" },
  { repo = "scripts/window-title-waybar", dest = ".local/bin/window-title-waybar" },
]

[tools.systemd]
files = [
  { repo = "systemd/user/niri-dynamic-float.service", dest = ".config/systemd/user/niri-dynamic-float.service" },
]
