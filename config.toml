#:schema https://forgejo.disilla.org/chrono/flux/raw/branch/main/schemas/config.schema.json

[general]
repo_path = "~/.dotfiles"
current_profile = "default"
symlink_resolution = "auto"

[tools.fonts]
files = [
  { repo = "fonts/SF-Mono-Regular.otf", dest = ".local/share/fonts/SF-Mono-Regular.otf" },
  { repo = "fonts/SFHello-Regular.otf", dest = ".local/share/fonts/SFHello-Regular.otf" },
  { repo = "fonts/SFMonoNerdFont-Regular.otf", dest = ".local/share/fonts/SFMonoNerdFont-Regular.otf" },
  { repo = "fonts/JetBrainsMonoNerdFont-Regular.ttf", dest = ".local/share/fonts/JetBrainsMonoNerdFont-Regular.ttf" },
  { repo = "fonts/IBMPlexSans.ttf", dest = ".local/share/fonts/IBMPlexSans.ttf" },
  { repo = "fonts/SF-Mono-Regular.otf", dest = "Library/Fonts/SF-Mono-Regular.otf" },
  { repo = "fonts/SFHello-Regular.otf", dest = "Library/Fonts/SFHello-Regular.otf" },
  { repo = "fonts/SFMonoNerdFont-Regular.otf", dest = "Library/Fonts/SFMonoNerdFont-Regular.otf" },
  { repo = "fonts/JetBrainsMonoNerdFont-Regular.ttf", dest = "Library/Fonts/JetBrainsMonoNerdFont-Regular.ttf" },
  { repo = "fonts/IBMPlexSans.ttf", dest = "Library/Fonts/IBMPlexSans.ttf" },
]

[tools.waybar]
files = [
  { repo = "waybar/config", dest = ".config/waybar/config" },
  { repo = "waybar/style.css", dest = ".config/waybar/style.css" },
]

[tools.zsh]
files = [
  { repo = "zsh/.zshrc", dest = ".zshrc", conditions = { os = [
    "linux",
  ] } },
  { repo = "zsh/.zshrc.macos", dest = ".zshrc", conditions = { os = [
    "darwin",
  ] } },
  { repo = "zsh/.zshrc.common", dest = ".zshrc.common" },
  { repo = "zsh/.zshrc.lazy", dest = ".zshrc.lazy" },
]

[tools.sway]
files = [
  { repo = "sway/config", dest = ".config/sway/config" },
  { repo = "sway/config.d/60-bindings-screenshot.conf", dest = ".config/sway/config.d/60-bindings-screenshot.conf" },
  { repo = "sway/config.d/90-bar.conf", dest = ".config/sway/config.d/90-bar.conf" },
]

[tools.starship]
files = [{ repo = "starship/starship.toml", dest = ".config/starship.toml" }]

# Alacritty (Terminal emulator)
[tools.alacritty]
files = [{ repo = "alacritty/alacritty.toml", dest = ".config/alacritty/alacritty.toml" }]

# Zed (Editor)
[tools.zed]
files = [{ repo = "zed/settings.json", dest = ".config/zed/settings.json" }]

# Ghostty (Terminal emulator)
[tools.ghostty]
folders = [{ repo = "ghostty", dest = ".config/ghostty" }]

# Neovim
[tools.nvim]
folders = [{ repo = "nvim", dest = ".config/nvim" }]

# Codex (AI assistant)
[tools.codex]
files = [
  { repo = "codex/config.toml", dest = ".codex/config.toml" },
  { repo = "codex/AGENTS.md", dest = ".codex/AGENTS.md" },
]
folders = [{ repo = "codex/skills", dest = ".codex/skills" }]

# Pi agent skills
[tools.pi]
folders = [{ repo = "pi/skills", dest = ".pi/agent/skills" }]

# Niri (Window manager)
[tools.niri]
folders = [{ repo = "niri", dest = ".config/niri" }]

# Noctalia (Desktop shell thing under Niri)
[tools.noctalia]
folders = [{ repo = "noctalia", dest = ".config/noctalia" }]

# Mako (Notification daemon)
[tools.mako]
folders = [{ repo = "mako", dest = ".config/mako" }]

# Fuzzel (Launcher)
[tools.fuzzel]
files = [{ repo = "fuzzel/fuzzel.ini", dest = ".config/fuzzel/fuzzel.ini" }]

# Overrides for applications
# For Discord, I do this to launch with Wayland. Electron by default would run under Xwayland.
[tools.applications]
files = [
  { repo = "applications/com.discordapp.Discord.desktop", dest = ".local/share/applications/com.discordapp.Discord.desktop" },
]

# Scripts for various utilities
# Most of these are simple tools for tools under Niri.
[tools.scripts]
files = [
  { repo = "scripts/window-title-waybar", dest = ".local/bin/window-title-waybar" },
  { repo = "scripts/niri-dynamic-float", dest = ".local/bin/niri-dynamic-float" },
]

# Background service that handles the Bitwarden floating window from Zen/Helium
[tools.systemd]
files = [
  { repo = "systemd/user/niri-dynamic-float.service", dest = ".config/systemd/user/niri-dynamic-float.service" },
]

[tools.fastfetch]
files = [{ repo = "fastfetch/config.jsonc", dest = "./.config/fastfetch/config.jsonc" }]
