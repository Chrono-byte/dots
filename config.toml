#:schema https://forgejo.disilla.org/chrono/flux/raw/branch/main/schemas/config.schema.json

[general]
repo_path = "~/.dotfiles"
current_profile = "default"
symlink_resolution = "auto"

[tools.fonts]
folders = [{ repo = "fonts/", dest = ".local/share/fonts/" }]

[tools.waybar]
files = [
  { repo = "waybar/config", dest = ".config/waybar/config" },
  { repo = "waybar/style.css", dest = ".config/waybar/style.css" },
]

[tools.zsh]
files = [
  { repo = "zsh/.zshrc", dest = ".zshrc" },
  { repo = "zsh/.zshrc.lazy", dest = ".zshrc.lazy" },
]

[tools.sway]
files = [
  { repo = "sway/config", dest = ".config/sway/config" },
  { repo = "sway/config.d/60-bindings-screenshot.conf", dest = ".config/sway/config.d/60-bindings-screenshot.conf" },
  { repo = "sway/config.d/90-bar.conf", dest = ".config/sway/config.d/90-bar.conf" },
]

[tools.starship]
files = [{ repo = "starship/starship.toml", dest = ".config/starship.toml" }]

[tools.alacritty]
files = [{ repo = "alacritty/alacritty.toml", dest = ".config/alacritty/alacritty.toml" }]

[tools.zed]
files = [{ repo = "zed/settings.json", dest = ".config/zed/settings.json" }]

[tools.ghostty]
files = [{ repo = "ghostty/config", dest = ".config/ghostty/config" }]

[tools.nvim]
folders = [{ repo = "nvim", dest = ".config/nvim" }]

[tools.codex]
files = [{ repo = "codex/config.toml", dest = ".codex/config.toml" }]
